name: WQTerm
options:
  bundleIdPrefix: com.wqterm.app
  deploymentTarget:
    # iOS 17 là mức tối thiểu cho ContentUnavailableView / NavigationSplitView /
    # .topBarLeading — các API được dùng xuyên suốt tầng UI.
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  indentWidth: 2
  tabWidth: 2

targets:
  WQTerm:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    entitlements:
      path: WQTerm/WQTerm.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wqterm.app
        get-task-allow: true
    sources:
      - path: WQTerm/App
      - path: WQTerm/Core
      - path: WQTerm/UI
      - path: WQTerm/Localizable.strings
        buildPhase: resources
      # a-Shell: header + mã C (stub ios_system.c nằm trong Core/Shell)
      - path: WQTerm/Resources/ios_system
        type: folder
        buildPhase: resources
      - path: WQTerm/Resources/Recipes
        type: folder
        buildPhase: resources
      - path: WQTerm/Resources/node_modules
        type: folder
        buildPhase: resources
      # Script Python cho lệnh `ai` (dùng requests, không dùng openai).
      - path: WQTerm/Resources/Scripts
        type: folder
        buildPhase: resources
      # Toolchain nhúng (curl/wget/tar/unzip/git/ffmpeg) — nếu có.
      # Thư mục rỗng vẫn an toàn: EnvironmentSetup chỉ cài cái tồn tại.
      - path: WQTerm/Resources/bin
        type: folder
        buildPhase: resources
      # Toolchain a-Shell thật (ios_system/shell/text/files/tar/awk framework).
      # CommandRunner dlopen các framework này lúc chạy để có lệnh Unix native.
      - path: WQTerm/Resources/toolchain
        type: folder
        buildPhase: resources
      # Node.js nhúng (NodeMobile.framework, 52MB arm64). Copy dạng folder
      # reference để bundle luôn chứa framework mà không cần link/ký — build
      # unsigned vẫn thành công, và RuntimeManager có thể load sau này.
      - path: WQTerm/Resources/node-ios-arm64
        type: folder
        buildPhase: resources
      - path: WQTerm/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: WQTerm/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.wqterm.app
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_BITCODE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Cần để dyld tìm NodeMobile.framework trong app bundle.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # Giữ nguyên Swift module cho mọi file C/ObjC-Interop
        SWIFT_OBJC_BRIDGING_HEADER: ""


