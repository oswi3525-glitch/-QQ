name: WQTerm
options:
  bundleIdPrefix: com.wqterm.app
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  indentWidth: 2
  tabWidth: 2

targets:
  WQTerm:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    entitlements:
      path: WQTerm/WQTerm.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wqterm.app
        get-task-allow: true
    sources:
      - path: WQTerm/App
      - path: WQTerm/Core
      - path: WQTerm/UI
      - path: WQTerm/Localizable.strings
        buildPhase: resources
      - path: WQTerm/Resources/Recipes
        type: folder
        buildPhase: resources
      - path: WQTerm/Resources/node_modules
        type: folder
        buildPhase: resources
      - path: WQTerm/Resources/node-ios-arm64
        type: folder
        buildPhase: resources
      - path: WQTerm/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: WQTerm/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.wqterm.app
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_BITCODE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
