name: WQTerm
options:
  bundleIdPrefix: com.wqterm.app
  deploymentTarget:
    iOS: 16.0
  xcodeVersion: "15.4"
  createIntergroupGroups: true
  indentWidth: 2
  tabWidth: 2

packages: []

targets:
  WQTerm:
    type: application
    platform: iOS
    deploymentTarget: 16.0
    bundleId: com.wqterm.app
    entitlements:
      com.apple.security.application-groups:
        - group.com.wqterm.app
      get-task-allow: true
    sources:
      - path: WQTerm/App
      - path: WQTerm/Core
      - path: WQTerm/UI
    resources:
      - path: WQTerm/Resources/ios_system
      - path: WQTerm/Resources/node-ios-arm64
      - path: WQTerm/Resources/node_modules
      - path: WQTerm/Resources/Recipes
      - path: WQTerm/Localizable.strings
    settings:
      INFOPLIST_FILE: WQTerm/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.wqterm.app
      SWIFT_VERSION: 5.9
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      OTHER_LDFLAGS: ""
      ENABLE_BITCODE: NO
      ENABLE_HARDENED_RUNTIME: NO

