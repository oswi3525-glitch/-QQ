name: WQTerm
options:
  bundleIdPrefix: com.wqterm.app
  deploymentTarget:
    # iOS 26 là mức tối thiểu để theo chuẩn Liquid Glass / iOS 27.
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  indentWidth: 2
  tabWidth: 2

targets:
  WQTerm:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    entitlements:
      path: WQTerm/WQTerm.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wqterm.app
        get-task-allow: true
    sources:
      - path: WQTerm/App
      - path: WQTerm/Core
      - path: WQTerm/UI
      - path: WQTerm/Localizable.strings
        buildPhase: resources
      # a-Shell: header + mã C (stub ios_system.c nằm trong Core/Shell)
      - path: WQTerm/Resources/ios_system
        type: folder
        buildPhase: resources
      - path: WQTerm/Resources/Recipes
        type: folder
        buildPhase: resources
      # Script Python cho lệnh `ai` (ai_cli.py dùng Groq + requests; ai.py là shim).
      - path: WQTerm/Resources/Scripts
        type: folder
        buildPhase: resources
      # Toolchain nhúng (curl/wget/tar/unzip/git/ffmpeg) — nếu có.
      # Thư mục rỗng vẫn an toàn: EnvironmentSetup chỉ cài cái tồn tại.
      - path: WQTerm/Resources/bin
        type: folder
        buildPhase: resources
      # Toolchain a-Shell thật (ios_system/shell/text/files/tar/awk framework).
      # CommandRunner dlopen các framework này lúc chạy để có lệnh Unix native.
      - path: WQTerm/Resources/toolchain
        type: folder
        buildPhase: resources
      # Python 3 runtime (CI điền từ scripts/fetch_runtime.sh trước khi generate).
      - path: WQTerm/Resources/python-runtime
        type: folder
        buildPhase: resources
      - path: WQTerm/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: WQTerm/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.wqterm.app
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_BITCODE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Giữ nguyên Swift module cho mọi file C/ObjC-Interop
        SWIFT_OBJC_BRIDGING_HEADER: ""


