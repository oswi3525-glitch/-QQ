name: Build WQTerm IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch embedded Python runtime (arm64)
        run: |
          # Module 5 yêu cầu Python 3 thật trong app. Gói 258MB không nằm trong
          # repo nên CI tải + trích slice arm64 (~217MB) trước khi generate project.
          set -o pipefail
          bash scripts/fetch_runtime.sh 2>&1 | tail -20
          du -sh WQTerm/Resources/python-runtime || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Fix Xcode project objectVersion
        run: |
          sed -i '' -E 's/(objectVersion = )[0-9]+;/\160;/' WQTerm.xcodeproj/project.pbxproj

      - name: Setup Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          BUILD_STATUS=0
          xcodebuild \
            -project WQTerm.xcodeproj \
            -scheme WQTerm \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath build/WQTerm.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            archive > build-log.txt 2>&1 || BUILD_STATUS=$?
          echo "=== Errors / result ==="
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build-log.txt | sort -u | head -80 || true
          exit $BUILD_STATUS

      - name: Show build errors
        if: failure()
        run: |
          echo "=== Errors ==="
          grep -E "error:" build-log.txt | sort -u | head -100 || echo "no 'error:' lines"
          echo "=== Tail ==="
          tail -60 build-log.txt || true

      - name: Verify app bundle
        run: |
          APP=build/WQTerm.xcarchive/Products/Applications/WQTerm.app
          test -d "$APP" || { echo "App bundle missing"; exit 1; }
          echo "--- Bundle contents ---"
          ls "$APP"
          echo "--- Key checks ---"
          test -f "$APP/Info.plist" && echo "ok: Info.plist"
          test -f "$APP/AppIcon60x60@2x.png" && echo "ok: app icon compiled" || echo "warn: app icon not found"
          test -f "$APP/Assets.car" && echo "ok: Assets.car"
          test -d "$APP/toolchain" && echo "ok: toolchain frameworks" || echo "warn: toolchain missing"
          test -d "$APP/Scripts" && echo "ok: ai.py script" || echo "warn: Scripts missing"
          test -d "$APP/python-runtime/python3_ios.framework" && echo "ok: python runtime (CPython engine)" || echo "warn: python runtime missing"
          test -d "$APP/python-runtime/Library/lib/python3.9" && echo "ok: python stdlib" || echo "warn: python stdlib missing"
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$APP/Info.plist" >/dev/null && echo "ok: UILaunchScreen present"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          echo "--- Bundle size ---"
          du -sh "$APP"

      - name: Package IPA
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/WQTerm.xcarchive/Products/Applications/WQTerm.app build/Payload/
          cd build && zip -r -X WQTerm.ipa Payload
          ls -lh WQTerm.ipa
          SIZE=$(stat -f%z WQTerm.ipa)
          MB=$((SIZE / 1048576))
          echo "### IPA size: ${MB} MB (${SIZE} bytes)" >> "$GITHUB_STEP_SUMMARY"
          echo "IPA size: ${MB} MB"
          if [ "$MB" -lt 50 ]; then
            echo "::warning::IPA nhỏ hơn 50MB — kiểm tra toolchain/runtime đã nhúng."
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WQTerm-ipa
          path: build/WQTerm.ipa

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: WQTerm v${{ github.run_number }}
          body_path: .github/release-notes.md
          files: build/WQTerm.ipa
          draft: false
          prerelease: false

